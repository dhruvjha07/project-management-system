<!DOCTYPE html>
<html>
<head>
<title>Create Task</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}"
>

</head>
<body>

<form method="POST">

<h2>Create Task</h2>

<input
type="text"
name="title"
placeholder="Task Title"
required
>

<textarea
name="description"
placeholder="Task Description"
required>
</textarea>

<input
type="date"
name="due_date"
required
>

<select
name="assigned_to"
required
>

<option value="">
Assign Member
</option>

{% for member in members %}

<option value="{{ member.id }}">
{{ member.name }}
</option>

{% endfor %}

</select>

<select
name="project_id"
required
>

<option value="">
Select Project
</option>

{% for project in projects %}

<option value="{{ project.id }}">
{{ project.project_name }}
</option>

{% endfor %}

</select>

<button type="submit">
Create Task
</button>

</form>

</body>
</html>
